name: Deploy ke Hostinger

# Setiap push ke main: build situs statis lalu upload folder out/ ke public_html via FTP.
# Butuh repository secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://regulora-consultant.com
      NEXT_PUBLIC_LAUNCH_READY: "true"
      NEXT_PUBLIC_GTM_ID: GTM-TDV6PL4B
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

      - run: sudo apt-get install -y -qq lftp

      # The FTP login lands in /public_html, which is NOT the web root. The site is
      # served from /domains/regulora-consultant.com/public_html (absolute path).
      # lftp mirrors against the server's real listing. Order: new _next assets
      # first, then pages, then prune old build folders inside _next only
      # (nothing else in the web root is deleted).
      # Plain FTP: Hostinger's FTPS data channel resets the connection.
      - name: Upload ke public_html
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          TARGET: /domains/regulora-consultant.com/public_html
        run: |
          lftp --env-password -u "$FTP_USERNAME" "ftp://${FTP_SERVER#ftp://}" -e "
            set cmd:fail-exit yes; set ftp:ssl-allow no; set net:max-retries 3; set net:timeout 30;
            cls $TARGET/index.html;
            mirror -R --parallel=4 out/_next/ $TARGET/_next/;
            mirror -R --parallel=4 -x '^_next/' out/ $TARGET/;
            mirror -R --delete --parallel=4 out/_next/ $TARGET/_next/;
            bye"
